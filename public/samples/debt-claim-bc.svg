<svg xmlns="http://www.w3.org/2000/svg" width="680" height="880" viewBox="0 0 680 880" font-family="'Public Sans', Arial, sans-serif">
  <rect width="680" height="880" fill="#ffffff"/>
  <rect x="0" y="0" width="680" height="880" fill="none" stroke="#e5e2da" stroke-width="2"/>

  <g transform="translate(48,48)" text-anchor="middle">
    <text x="292" y="0" font-size="13" font-weight="700" fill="#1a1a1a">PROVINCIAL COURT OF BRITISH COLUMBIA</text>
    <text x="292" y="20" font-size="12" font-weight="600" fill="#1a1a1a">(SMALL CLAIMS) — VICTORIA REGISTRY</text>
    <text x="292" y="40" font-size="10.5" fill="#6b6b6b">Notice of Claim — Form 1</text>
  </g>
  <line x1="48" y1="108" x2="632" y2="108" stroke="#1a1a1a" stroke-width="1.2"/>

  <g transform="translate(48,134)" font-size="11" fill="#333">
    <text x="0" y="0">Claim No.: VIC-S-2024-7741</text>
    <text x="380" y="0">Date served: SAMPLE</text>
  </g>

  <g transform="translate(48,176)" font-size="11.5" fill="#222">
    <text x="0" y="0" font-weight="700">BETWEEN:</text>
    <text x="0" y="22">CASCADE ASSET RECOVERY LTD.</text>
    <text x="0" y="38" font-size="10" fill="#6b6b6b">(debt purchaser)</text>
    <text x="300" y="22" font-style="italic" fill="#6b6b6b">Claimant</text>
    <text x="0" y="64" font-weight="700">- and -</text>
    <text x="0" y="86">DANIEL TREMBLAY</text>
    <text x="300" y="86" font-style="italic" fill="#6b6b6b">Defendant</text>
  </g>

  <g transform="translate(48,300)" font-size="12" fill="#1a1a1a">
    <text x="0" y="0" font-weight="700">THE CLAIMANT CLAIMS:</text>
    <text x="0" y="26">1. CA$3,920.40 for an unpaid credit-card account purchased by the</text>
    <text x="0" y="44">   claimant from the original creditor.</text>
    <text x="0" y="68">2. Court order interest and the costs of this claim.</text>

    <rect x="-8" y="96" width="560" height="66" fill="#fdeceb" stroke="#e3b3ae"/>
    <text x="8" y="120" font-weight="700" fill="#9a2b22" font-size="12.5">You have FOURTEEN (14) DAYS to file a Reply (Form 2).</text>
    <text x="8" y="142" font-weight="700" fill="#9a2b22" font-size="12.5">If you do not, a default order may be made against you.</text>

    <text x="0" y="200" font-size="11.5">The last payment on this account appears to be several years ago.</text>
    <text x="0" y="232" font-size="11.5">Filed at the registry of the Provincial Court of British Columbia.</text>
  </g>

  <g transform="translate(340,470)" opacity="0.12">
