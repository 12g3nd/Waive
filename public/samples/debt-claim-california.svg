<svg xmlns="http://www.w3.org/2000/svg" width="680" height="880" viewBox="0 0 680 880" font-family="'Public Sans', Arial, sans-serif">
  <rect width="680" height="880" fill="#ffffff"/>
  <rect x="0" y="0" width="680" height="880" fill="none" stroke="#e5e2da" stroke-width="2"/>

  <g transform="translate(48,48)" text-anchor="middle">
    <text x="292" y="0" font-size="13" font-weight="700" fill="#1a1a1a">SUPERIOR COURT OF CALIFORNIA</text>
    <text x="292" y="20" font-size="12" font-weight="600" fill="#1a1a1a">COUNTY OF SAN DIEGO</text>
    <text x="292" y="40" font-size="10.5" fill="#6b6b6b">Summons &amp; Complaint — SUM-100</text>
  </g>
  <line x1="48" y1="108" x2="632" y2="108" stroke="#1a1a1a" stroke-width="1.2"/>

  <g transform="translate(48,134)" font-size="11" fill="#333">
    <text x="0" y="0">Case No.: 37-2024-00098765-CL</text>
    <text x="380" y="0">Date served: SAMPLE</text>
  </g>

  <g transform="translate(48,176)" font-size="11.5" fill="#222">
    <text x="0" y="0" font-weight="700">PLAINTIFF:</text>
    <text x="0" y="20">MERIDIAN PORTFOLIO ACQUISITIONS LLC</text>
    <text x="0" y="36" font-size="10" fill="#6b6b6b">(debt buyer)</text>
    <text x="0" y="64" font-weight="700">DEFENDANT:</text>
    <text x="0" y="84">MARCUS WHITFIELD</text>
  </g>

  <g transform="translate(48,290)" font-size="12" fill="#1a1a1a">
    <text x="0" y="0" font-weight="700">YOU ARE BEING SUED. THE PLAINTIFF ALLEGES:</text>
    <text x="0" y="26">1. $5,215.00 due on a credit-card account sold to the plaintiff, plus</text>
    <text x="0" y="44">   interest and costs of suit.</text>

    <rect x="-8" y="72" width="568" height="84" fill="#fdeceb" stroke="#e3b3ae"/>
    <text x="8" y="96" font-weight="700" fill="#9a2b22" font-size="12.5">You have 30 CALENDAR DAYS after this summons is served</text>
    <text x="8" y="116" font-weight="700" fill="#9a2b22" font-size="12.5">to file a written response (an Answer) at this court.</text>
    <text x="8" y="138" font-weight="700" fill="#9a2b22" font-size="12.5">If you do not, the court may decide against you by default.</text>

    <text x="0" y="194" font-size="11.5">The last payment on this account appears to be several years ago.</text>
    <text x="0" y="226" font-size="11.5">Clerk of the Superior Court.</text>
  </g>

  <g transform="translate(340,480)" opacity="0.12">
    <text x="0" y="0" font-size="56" font-weight="800" fill="#9a2b22" text-anchor="middle"
          transform="rotate(-24)">SAMPLE — NOT A REAL NOTICE</text>
  </g>

  <text x="48" y="852" font-size="9.5" fill="#9a9a9a">Synthetic document generated for the Waive demo. No real person or PII. Not a real court document.</text>
